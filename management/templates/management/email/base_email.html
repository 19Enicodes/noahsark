{% comment %}
Wrapper for every outbound email. Inline styles only - email clients strip
<style> blocks. Palette matches the web app: gold #b4781e on dark #1a1814.
{% endcomment %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f2ee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #f4f2ee; padding: 24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(26, 24, 20, 0.08);">

            <!-- Header -->
            <tr>
              <td style="background-color: #1a1814; padding: 28px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding-right: 12px;">
                      <div style="width: 40px; height: 40px; background-color: #b4781e; border-radius: 10px; text-align: center; line-height: 40px; color: #ffffff; font-size: 20px; font-weight: bold;">&#10013;</div>
                    </td>
                    <td>
                      <div style="color: #ffffff; font-size: 18px; font-weight: bold; line-height: 1.2;">{{ church_name }}</div>
                      <div style="color: #a09a90; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600;">Worker &amp; Member Care</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Gold accent rule -->
            <tr><td style="height: 4px; background-color: #b4781e; line-height: 4px; font-size: 0;">&nbsp;</td></tr>

            <!-- Body -->
            <tr>
              <td style="padding: 32px;">
                {% for paragraph in paragraphs %}
                <p style="margin: 0 0 18px 0; color: #2c2822; font-size: 16px; line-height: 1.65;">{{ paragraph }}</p>
                {% endfor %}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="background-color: #faf8f5; border-top: 1px solid #eae6df; padding: 20px 32px; text-align: center;">
                <p style="margin: 0; color: #8a8378; font-size: 12px; line-height: 1.6;">
                  Sent with love by the {{ church_name }} family.<br />
                  You are receiving this because you are registered with us.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
